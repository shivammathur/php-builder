name: Package PHP Extensions
run-name: Package PHP ${{ inputs.php-version || '8.4' }} extensions ${{ inputs.extensions }}

on:
  workflow_dispatch:
    inputs:
      extensions:
        description: 'Space or comma separated extensions to rebuild'
        required: true
      build-mode:
        description: 'Build mode: --build-all or --build-new'
        default: '--build-all'
        required: false
      php-source:
        description: 'PHP source: --web-php or --php-src'
        default: ''
        required: false
      php-version:
        description: 'PHP version to package'
        default: '8.4'
        required: false
      container-os-versions:
        description: 'OS versions to package on'
        default: 'ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 arm64v8/ubuntu:22.04 arm64v8/ubuntu:24.04 arm64v8/ubuntu:26.04 debian:12 debian:trixie'
        required: false

permissions:
  contents: write

env:
  CONTAINER_OS_LIST: ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 arm64v8/ubuntu:22.04 arm64v8/ubuntu:24.04 arm64v8/ubuntu:26.04 debian:12 debian:trixie
  RUNNER_OS_LIST: ubuntu-22.04 ubuntu-24.04 ubuntu-22.04-arm ubuntu-24.04-arm
  SAPI_LIST: apache2 cgi cli embed fpm phpdbg
  BUILD_LIST: nts zts
  CONTAINER_BASE: ubuntu-24.04
  CONTAINER_BASE_ARM: ubuntu-24.04-arm

jobs:
  get-matrix:
    runs-on: ubuntu-latest
    outputs:
      container_only: ${{ steps.set-matrix.outputs.container_only }}
      container_os_matrix: ${{ steps.set-matrix.outputs.container_os_matrix }}
      test_container_os_matrix: ${{ steps.set-matrix.outputs.test_container_os_matrix }}
      test_runner_os_matrix: ${{ steps.set-matrix.outputs.test_runner_os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get matrix
        id: set-matrix
        env:
          COMMIT: ${{ inputs.build-mode }}
          CONTAINER_OS_LIST: ${{ inputs.container-os-versions || env.CONTAINER_OS_LIST }}
          CONTAINER_BASE: ${{ env.CONTAINER_BASE }}
          CONTAINER_BASE_ARM: ${{ env.CONTAINER_BASE_ARM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_OS_LIST: ${{ env.RUNNER_OS_LIST }}
          PHP_LIST: ${{ inputs.php-version }}
          PHP_SOURCE: ${{ inputs.php-source || '--web-php' }}
          SAPI_LIST: ${{ env.SAPI_LIST }}
          BUILD_LIST: ${{ env.BUILD_LIST }}
        run: bash scripts/get-matrix.sh

  package:
    needs: get-matrix
    if: "!contains(inputs.build-mode, 'skip-package')"
    container: ${{ matrix.container }}
    runs-on: ${{ matrix.container-base }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.container_os_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install required packages
        run: bash scripts/install-requirements.sh
        env:
          BUILD: ${{ matrix.build }}
          PHP_VERSION: ${{ matrix.php-version }}

      - name: Download source release packages
        shell: bash
        env:
          BUILD: ${{ matrix.build }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          . /etc/os-release
          suffix=
          [ "$BUILD" = zts ] && suffix=-zts
          arch_suffix=
          [[ "$(arch)" = aarch64 || "$(arch)" = arm64 ]] && arch_suffix=_arm64
          package="php_${PHP_VERSION}${suffix}+${ID}${VERSION_ID}${arch_suffix}.tar.zst"
          debug_package="php_${PHP_VERSION}${suffix}-dbgsym+${ID}${VERSION_ID}${arch_suffix}.tar.zst"
          mkdir -p /tmp/source-artifact
          gh release download "$PHP_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$package" --pattern "$debug_package" --dir /tmp/source-artifact
          test -s "/tmp/source-artifact/$package"
          test -s "/tmp/source-artifact/$debug_package"

      - name: Stage source package and debug symbols
        run: bash scripts/stage-package-extensions.sh
        env:
          BUILD: ${{ matrix.build }}
          EXTENSIONS_TO_BUILD: ${{ inputs.extensions }}
          PHP_VERSION: ${{ matrix.php-version }}
          SOURCE_ARTIFACT_DIR: /tmp/source-artifact
          SOURCE_DEBUG_ROOT: /tmp/source-debug

      - name: Build selected extensions
        run: bash scripts/build.sh build_extensions
        env:
          BUILD: ${{ matrix.build }}
          EXTENSIONS_TO_BUILD: ${{ inputs.extensions }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHP_VERSION: ${{ matrix.php-version }}
          PHP_SOURCE: ${{ inputs.php-source }}

      - name: Package build
        run: bash scripts/build.sh package
        env:
          BUILD: ${{ matrix.build }}
          SAPI_LIST: ${{ env.SAPI_LIST }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_MESSAGE: ${{ inputs.build-mode }}
          GITHUB_NAME: 'Shivam Mathur'
          GITHUB_EMAIL: ${{ secrets.email }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PHP_VERSION: ${{ matrix.php-version }}
          PHP_SOURCE: ${{ inputs.php-source }}
          SOURCE_DEBUG_ROOT: /tmp/source-debug

      - name: Check packaged extensions and debug symbols
        shell: bash
        env:
          BUILD: ${{ matrix.build }}
          EXTENSIONS_TO_BUILD: ${{ inputs.extensions }}
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          suffix=
          [ "$BUILD" = zts ] && suffix=-zts
          mapfile -t packages < <(find /tmp -maxdepth 1 -type f -name "php_${PHP_VERSION}${suffix}+*.tar.zst")
          mapfile -t debug_packages < <(find /tmp -maxdepth 1 -type f -name "php_${PHP_VERSION}${suffix}-dbgsym+*.tar.zst")
          test "${#packages[@]}" -eq 1
          test "${#debug_packages[@]}" -eq 1
          tar -I zstd -tf "${packages[0]}" > /tmp/package-contents.txt
          extension_dir="$(php-config --extension-dir)"
          for extension in ${EXTENSIONS_TO_BUILD//,/ }; do
            grep -Fx "./${extension_dir#/}/$extension.so" /tmp/package-contents.txt
          done
          if grep -Fq './usr/lib/debug/.build-id/' /tmp/package-contents.txt; then
            echo 'Release package unexpectedly contains debug symbols'
            exit 1
          fi
          tar -I zstd -tf "${debug_packages[0]}" > /tmp/debug-package-contents.txt
          grep -Fq './usr/lib/debug/.build-id/' /tmp/debug-package-contents.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: php${{ matrix.php-version }}-${{ matrix.build }}+${{ matrix.dist }}-${{ matrix.dist-version }}
          path: |
            /tmp/*.xz
            /tmp/*.zst

      - name: Check PHP and extensions
        run: |
          php -v
          php -r "if(strpos(phpversion(), '${{ matrix.php-version }}') === false) {throw new Exception('Wrong PHP version Installed');}"
          php-cgi -v
          php-fpm -v && php-fpm -t
          phpdbg -V
          php-config --version
          phpize -v
          bash scripts/test_extensions.sh
        env:
          PHP_VERSION: ${{ matrix.php-version }}

  local-test:
    needs: [package, get-matrix]
    runs-on: ${{ matrix.container-base }}
    if: "!contains(inputs.build-mode, 'skip-local-test')"
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.test_container_os_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: php${{ matrix.php-version }}-${{ matrix.build }}+${{ matrix.dist }}-${{ matrix.dist-version }}
          path: /tmp

      - name: Install PHP
        shell: bash
        run: |
          sed -i '/download/d' scripts/install.sh
          bash scripts/install.sh ${{ matrix.php-version }} local ${{ matrix.debug }} ${{ matrix.build }}

      - name: Test
        run: |
          php -v
          php -r "if(strpos(phpversion(), '${{ matrix.php-version }}') === false) {throw new Exception('Wrong PHP version Installed');}"
          php -m

      - name: Check GD support
        run: php -r "print_r(gd_info());"

      - name: Test pecl
        run: bash scripts/test_pecl.sh
        env:
          PHP_VERSION: ${{ matrix.php-version }}

      - name: Check SAPI
        run: bash scripts/test_sapi.sh
        env:
          PHP_VERSION: ${{ matrix.php-version }}

  github-test:
    needs: [package, get-matrix]
    runs-on: ${{ matrix.os }}
    if: "!contains(inputs.build-mode, 'skip-github-test') && contains(needs.get-matrix.outputs.container_only, 'false')"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.test_runner_os_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: php${{ matrix.php-version }}-${{ matrix.build }}+${{ matrix.os }}
          path: /tmp

      - name: Install PHP
        shell: bash
        run: |
          sed -i '/download/d' scripts/install.sh
          bash scripts/install.sh ${{ matrix.php-version }} github ${{ matrix.debug }} ${{ matrix.build }}

      - name: Test
        run: |
          php -v
          php -r "if(strpos(phpversion(), '${{ matrix.php-version }}') === false) {throw new Exception('Wrong PHP version Installed');}"
          php -m

      - name: Test pecl
        run: bash scripts/test_pecl.sh
        env:
          PHP_VERSION: ${{ matrix.php-version }}

      - name: Check SAPI
        run: bash scripts/test_sapi.sh
        env:
          PHP_VERSION: ${{ matrix.php-version }}

  release-container-only:
    needs: [get-matrix, local-test]
    runs-on: ubuntu-latest
    if: "!contains(inputs.build-mode, 'skip-release') && contains(needs.get-matrix.outputs.container_only, 'true')"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create builds directory
        run: mkdir builds

      - uses: actions/download-artifact@v8
        with:
          path: builds

      - name: Release
        run: bash scripts/release.sh
        env:
          GITHUB_MESSAGE: ${{ inputs.build-mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHP_LIST: ${{ inputs.php-version }}
          PHP_SOURCE: ${{ inputs.php-source }}

  release:
    needs: [get-matrix, local-test, github-test]
    runs-on: ubuntu-latest
    if: "!contains(inputs.build-mode, 'skip-release') && contains(needs.get-matrix.outputs.container_only, 'false')"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create builds directory
        run: mkdir builds

      - uses: actions/download-artifact@v8
        with:
          path: builds

      - name: Release
        run: bash scripts/release.sh
        env:
          GITHUB_MESSAGE: ${{ inputs.build-mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHP_LIST: ${{ inputs.php-version }}
          PHP_SOURCE: ${{ inputs.php-source }}
