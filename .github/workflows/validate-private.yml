name: Validate private staging
on:
  push:
    branches: [feature/private-r2-releases]
  pull_request:
    paths:
      - 'scripts/private/**'
      - 'tests/private/**'
      - '.github/workflows/*private.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m unittest discover -s tests/private -v
      - name: Check shell syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
