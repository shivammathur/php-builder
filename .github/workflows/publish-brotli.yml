name: Publish verified Brotli rebuilds
run-name: Publish verified PHP Brotli rebuilds

on:
  push:
    branches: [feature/brotli-artifact-publication]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: php-builder-brotli-publication-${{ matrix.php }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6', '8.7']
    steps:
      - uses: actions/checkout@v6
      - name: Publish exact verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publication/brotli-20261024/publish.py '${{ matrix.php }}'
      - name: Preserve publication receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ matrix.php }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: error
          retention-days: 90
