name: Repackage ASAN releases

on:
  push:
    branches: [release/repackage-asan-extensions]

permissions:
  contents: write

jobs:
  repackage:
    name: PHP ${{ matrix.php }} ${{ matrix.build }} ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.7']
        build: [asan, zts-asan]
        platform: [debian12, debian13, ubuntu22.04, ubuntu22.04_arm64, ubuntu24.04, ubuntu24.04_arm64, ubuntu26.04, ubuntu26.04_arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Repackage existing release
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_VERSION: ${{ matrix.php }}
          PACKAGE: php_${{ matrix.php }}-${{ matrix.build }}+${{ matrix.platform }}.tar
        run: |
          sudo --preserve-env=GITHUB_REPOSITORY bash scripts/install-zstd.sh
          bash scripts/repackage-asan-release.sh
